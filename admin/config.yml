# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json
# ============================================================
# Panel de contenido — ESTUDIO
# Backend GitHub. En local el nombre del repo puede ser
# cualquiera (flujo local con File System Access API).
# En producción: poner "usuario/repo" real y entrar con el
# token de GitHub (botón "Sign In with Token").
# ============================================================

backend:
  name: github
  repo: ivielmotion/portfolio-estudio

locale: es
media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "sitio"
    label: "Contenido del sitio"
    files:
      - name: "content"
        label: "Contenido general"
        file: "data/content.json"
        format: "json"
        fields:
          - label: "Sitio"
            name: "site"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Título (pestaña del navegador)", name: "title", widget: "string" }
              - { label: "Descripción (SEO)", name: "description", widget: "text" }

          - label: "Hero (titular principal)"
            name: "hero"
            widget: "object"
            fields:
              - label: "Palabras (una por línea)"
                name: "lines"
                widget: "list"
                field: { label: "Palabra", name: "line", widget: "string" }

          - label: "About (página independiente)"
            name: "about"
            widget: "object"
            fields:
              - { label: "Texto superior", name: "eyebrow", widget: "string" }
              - { label: "Título sans", name: "titleSans", widget: "string" }
              - { label: "Título editorial", name: "titleEditorial", widget: "string" }
              - { label: "Introducción", name: "intro", widget: "text" }
              - { label: "Biografía breve", name: "bio", widget: "text" }
              - label: "Datos de perfil"
                name: "facts"
                widget: "list"
                label_singular: "dato"
                fields:
                  - { label: "Etiqueta", name: "label", widget: "string" }
                  - { label: "Texto", name: "value", widget: "string" }
              - label: "Principios de trabajo"
                name: "principles"
                widget: "list"
                label_singular: "principio"
                fields:
                  - { label: "Número", name: "number", widget: "string" }
                  - { label: "Título", name: "title", widget: "string" }
                  - { label: "Texto", name: "text", widget: "text" }

          - label: "Clientes"
            name: "clients"
            widget: "object"
            fields:
              - { label: "Título de recomendaciones", name: "title", widget: "string" }
              - label: "Recomendaciones"
                name: "testimonials"
                widget: "list"
                label_singular: "recomendación"
                fields:
                  - { label: "Texto", name: "quote", widget: "text" }
                  - { label: "Nombre", name: "name", widget: "string" }
                  - { label: "Cargo y empresa", name: "role", widget: "string" }
              - label: "Lista de clientes"
                name: "items"
                widget: "list"
                label_singular: "cliente"
                fields:
                  - { label: "Nombre", name: "name", widget: "string" }
                  - { label: "Logo (opcional, WebP < 60 KB)", name: "logo", widget: "image", required: false }
                  - { label: "Estilo CSS si no hay logo", name: "style", widget: "string", required: false }

          - label: "Servicios"
            name: "services"
            widget: "object"
            fields:
              - { label: "Título de la sección", name: "title", widget: "string" }
              - label: "Grupos de servicios"
                name: "groups"
                widget: "list"
                label_singular: "grupo"
                fields:
                  - { label: "ID (minúsculas, sin espacios)", name: "id", widget: "string" }
                  - { label: "Nombre", name: "name", widget: "string" }
                  - label: "Categorías"
                    name: "items"
                    widget: "list"
                    field: { label: "Categoría", name: "item", widget: "string" }

          - label: "Contacto"
            name: "contact"
            widget: "object"
            fields:
              - label: "Llamada a la acción (palabras)"
                name: "cta"
                widget: "list"
                field: { label: "Palabra", name: "word", widget: "string" }
              - { label: "Dirección (una línea por renglón)", name: "address", widget: "text" }
              - { label: "Email", name: "email", widget: "string" }
              - { label: "Teléfono", name: "phone", widget: "string" }
              - label: "Redes sociales"
                name: "social"
                widget: "list"
                label_singular: "red social"
                fields:
                  - { label: "Nombre", name: "name", widget: "string" }
                  - { label: "URL", name: "url", widget: "string" }

          - label: "Portfolio (proyectos)"
            name: "portfolio"
            widget: "list"
            label_singular: "proyecto"
            fields:
              - { label: "ID (minúsculas y guiones)", name: "id", widget: "string" }
              - { label: "Título", name: "title", widget: "string" }
              - { label: "Subtítulo", name: "subtitle", widget: "string", required: false }
              - { label: "Categoría", name: "category", widget: "string", required: false }
              - { label: "Cliente", name: "client", widget: "string", required: false }
              - { label: "Rol", name: "role", widget: "string", required: false }
              - { label: "Año", name: "year", widget: "string" }
              - { label: "Descripción de la página", name: "description", widget: "text", required: false }
              - label: "Formato de la tarjeta"
                name: "format"
                widget: "select"
                options:
                  - { label: "Vertical", value: "portrait" }
                  - { label: "Vertical alta", value: "tall" }
                  - { label: "Cuadrada", value: "square" }
                default: "portrait"
              - label: "Filtros"
                name: "tags"
                widget: "list"
                required: false
                field: { label: "Filtro", name: "tag", widget: "string" }
              - { label: "Imagen vertical del Portfolio", name: "image", widget: "image", required: false }
              - { label: "Portada horizontal del vídeo", name: "poster", widget: "image", required: false }
              - { label: "Vídeo (URL de Vimeo o ID)", name: "video", widget: "string", required: false }
              - { label: "Enlace externo del caso", name: "url", widget: "string", required: false }
              - { label: "Texto del botón externo", name: "caseLabel", widget: "string", required: false }
              - label: "Galería del proyecto"
                name: "gallery"
                widget: "list"
                required: false
                label_singular: "imagen"
                fields:
                  - { label: "Imagen", name: "image", widget: "image", required: false }
                  - { label: "Texto alternativo", name: "alt", widget: "string", required: false }
                  - { label: "Pie de imagen", name: "caption", widget: "string", required: false }
              - { label: "Visible en la web", name: "visible", widget: "boolean", default: true }
